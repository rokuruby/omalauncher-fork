name: patched

# Builds the widgets + Download APK, signed with the key in this repo's secrets, and keeps it as an artifact.
on:
  push:
    branches: [widgets-download]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch proot
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libarchive-tools
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null
          scripts/fetch-proot.sh

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build
        run: ./gradlew :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: omalauncher-widgets-download
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
